# Deploys the Sahrae Weather site and refreshes its data relay every hour.
# (Generated from the private source repo by `npm run build:pages`; edit it there.)
name: Deploy site with fresh data relay
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *" # hourly
  workflow_dispatch:
permissions:
  contents: write # keep-alive commit only
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Copy sources that block web pages (NOAA, NASA) to /relay
        run: node relay-tools/fetch.mjs
      - name: Keep the hourly schedule alive
        # GitHub pauses scheduled workflows after 60 days without commits.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3888000 ]; then
            git config user.name "sahrae-weather-bot"
            git config user.email "noreply@users.noreply.github.com"
            git commit --allow-empty -m "Keep the hourly data relay schedule active"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
